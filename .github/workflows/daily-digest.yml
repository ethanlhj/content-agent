name: Daily content digest

on:
  schedule:
    # 13:30 UTC = 9:30 AM Toronto (EDT). Winter (EST) this fires 8:30 AM — adjust to 14:30 if you care.
    - cron: "30 13 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write # lets the workflow commit refreshed data back

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04 # pinned: cached whisper binary is built for this image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg + yt-dlp
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pipx install yt-dlp

      - name: Cache whisper.cpp build + model
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: |
            whisper.cpp/build/bin/whisper-cli
            whisper.cpp/models/ggml-base.en.bin
          key: whisper-cpp-static-ubuntu2404-v2

      - name: Build whisper.cpp + download model
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j --target whisper-cli
          bash ./models/download-ggml-model.sh base.en

      - name: Check whisper binary runs
        continue-on-error: true # digest still sends if transcription is broken; run-all alerts you
        run: whisper.cpp/build/bin/whisper-cli --help > /dev/null && echo "whisper-cli OK"

      - name: Write .env from secrets
        env:
          ENV_FILE: ${{ secrets.ENV }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Run full cycle
        env:
          WHISPER_CLI: ${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli
          WHISPER_MODEL: ${{ github.workspace }}/whisper.cpp/models/ggml-base.en.bin
        run: node scripts/run-all.js

      - name: Commit refreshed data back
        run: |
          rm -f .env
          git config user.name "content-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/data.json dashboard/data.js dashboard/scripts_data.js output/ scripts/reel-to-script/last_*.json scripts/reel-to-script/last_*.txt || true
          git diff --cached --quiet || git commit -m "data: daily pull $(date -u +%F)"
          git pull --rebase --autostash && git push
