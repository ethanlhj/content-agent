name: Telegram reel inbox

# Send your bot an Instagram reel link -> within ~10-15 min it replies with the
# transcript, the format breakdown and a draft script in your voice.
on:
  schedule:
    - cron: "*/10 * * * *" # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-inbox
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      has_work: ${{ steps.peek.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write .env from secrets
        env:
          ENV_FILE: ${{ secrets.ENV }}
        run: printf '%s\n' "$ENV_FILE" > .env
      - name: Any reel links waiting?
        id: peek
        run: node scripts/telegram-inbox.js --check

  process:
    needs: check
    if: needs.check.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg + yt-dlp
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pipx install yt-dlp

      - name: Cache whisper.cpp build + model
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: |
            whisper.cpp/build/bin/whisper-cli
            whisper.cpp/models/ggml-base.en.bin
          key: whisper-cpp-static-ubuntu2404-v2

      - name: Build whisper.cpp + download model
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j --target whisper-cli
          bash ./models/download-ggml-model.sh base.en

      - name: Check whisper binary runs
        run: whisper.cpp/build/bin/whisper-cli --help > /dev/null && echo "whisper-cli OK"

      - name: Write .env from secrets
        env:
          ENV_FILE: ${{ secrets.ENV }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Transcribe + reply in Telegram
        env:
          WHISPER_CLI: ${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli
          WHISPER_MODEL: ${{ github.workspace }}/whisper.cpp/models/ggml-base.en.bin
        run: node scripts/telegram-inbox.js --process

      - name: Save scripts to repo
        if: always()
        run: |
          rm -f .env
          git config user.name "content-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ scripts/reel-to-script/last_*.json scripts/reel-to-script/last_*.txt || true
          git diff --cached --quiet || git commit -m "script: telegram reel $(date -u +%F)"
          git pull --rebase --autostash && git push
